name: Release

# Pushing a version tag (for example v1.0.0) builds the web UI, cross-compiles
# the proxy for Linux and Windows, and publishes a GitHub Release with the
# archives and their checksums.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Full history so version information can be derived from tags.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The UI assets are embedded into the Go binary with go:embed, so they
      # must exist before the Go build runs.
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build Linux binary
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o redactor-linux-amd64 ./cmd/redactor

      - name: Build Windows binary
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o redactor-windows-amd64.exe ./cmd/redactor

      - name: Prepare sample config
        run: cp config.toml.example config.toml

      - name: Create Linux archive
        run: tar -czf redactor-linux-amd64.tar.gz redactor-linux-amd64 config.toml README.md

      - name: Create Windows archive
        run: 7z a redactor-windows-amd64.zip redactor-windows-amd64.exe config.toml README.md

      - name: Generate checksums
        run: sha256sum *.tar.gz *.zip > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            redactor-linux-amd64.tar.gz
            redactor-windows-amd64.zip
            checksums.txt
